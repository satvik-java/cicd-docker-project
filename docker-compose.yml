name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd demo-app
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          cd demo-app
          pytest

      - name: Build Docker Image
        run: |
          docker build -t cicd-demo-app ./demo-app