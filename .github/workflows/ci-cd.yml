name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r demo-app/requirements.txt
          pip install pytest

      - name: Run Tests
        run: |
          cd demo-app
          pytest

      - name: Build Docker Image
        run: |
          docker build -t cicd-demo-app ./demo-app